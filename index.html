<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake King</title>
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
  margin:0;
  padding:15px;
}

h1{
  margin:10px;
}

canvas{
  background:black;
  border:5px solid #00ff00;
  max-width:95%;
}

button{
  font-size:25px;
  padding:12px 22px;
  margin:5px;
  border:0;
  border-radius:10px;
}

.controls{
  margin-top:10px;
}
</style>
</head>

<body>

<h1>🐍 Snake King</h1>

<h2>
Score: <span id="score">0</span> |
High Score: <span id="high">0</span> |
❤️ Lives: <span id="lives">3</span>
</h2>

<canvas id="game" width="300" height="300"></canvas>

<div class="controls">
  <div>
    <button onclick="changeDir('up')">⬆️</button>
  </div>

  <div>
    <button onclick="changeDir('left')">⬅️</button>
    <button onclick="changeDir('down')">⬇️</button>
    <button onclick="changeDir('right')">➡️</button>
  </div>
</div>

<br>

<button onclick="pauseGame()">⏸️ Pause</button>
<button onclick="restart()">🔄 Restart</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let snake;
let food;
let dx;
let dy;
let score;
let lives;
let paused = false;
let speed = 150;
let timer;

let highScore = localStorage.getItem("snakeHigh") || 0;

document.getElementById("high").innerText = highScore;

function restart(){

  clearInterval(timer);

  snake = [
    {x:140,y:140},
    {x:130,y:140},
    {x:120,y:140}
  ];

  dx = 10;
  dy = 0;

  score = 0;
  lives = 3;
  paused = false;
  speed = 150;

  document.getElementById("score").innerText = score;
  document.getElementById("lives").innerText = lives;

  createFood();

  timer = setInterval(draw, speed);
}

function createFood(){

  food = {
    x: Math.floor(Math.random()*29)*10,
    y: Math.floor(Math.random()*29)*10
  };
}

function draw(){

  if(paused) return;

  ctx.fillStyle = "black";
  ctx.fillRect(0,0,300,300);

  let head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  if(
    head.x < 0 ||
    head.x >= 300 ||
    head.y < 0 ||
    head.y >= 300 ||
    hitSnake(head)
  ){

    lives--;

    document.getElementById("lives").innerText = lives;

    if(lives <= 0){
      clearInterval(timer);
      alert("Game Over! Score: " + score);
      return;
    }

    snake = [
      {x:140,y:140},
      {x:130,y:140},
      {x:120,y:140}
    ];

    dx = 10;
    dy = 0;
    return;
  }

  snake.unshift(head);

  if(head.x === food.x && head.y === food.y){

    score++;

    document.getElementById("score").innerText = score;

    if(score > highScore){

      highScore = score;

      localStorage.setItem("snakeHigh", highScore);

      document.getElementById("high").innerText = highScore;
    }

    createFood();

    if(score % 5 === 0){

      speed = Math.max(60, speed - 15);

      clearInterval(timer);
      timer = setInterval(draw, speed);
    }

  }else{

    snake.pop();
  }

  // Food
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(food.x+5,food.y+5,5,0,Math.PI*2);
  ctx.fill();

  // Snake
  for(let i=0;i<snake.length;i++){

    ctx.fillStyle = i === 0 ? "#00ff66" : "#00aa44";

    ctx.fillRect(
      snake[i].x,
      snake[i].y,
      10,
      10
    );
  }
}

function hitSnake(head){

  for(let i=0;i<snake.length;i++){

    if(
      head.x === snake[i].x &&
      head.y === snake[i].y
    ){
      return true;
    }
  }

  return false;
}

function changeDir(dir){

  if(dir === "up" && dy === 0){

    dx = 0;
    dy = -10;
  }

  if(dir === "down" && dy === 0){

    dx = 0;
    dy = 10;
  }

  if(dir === "left" && dx === 0){

    dx = -10;
    dy = 0;
  }

  if(dir === "right" && dx === 0){

    dx = 10;
    dy = 0;
  }
}

function pauseGame(){

  paused = !paused;
}

restart();

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>

</body>
</html>
